<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Website Konversi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/vite.svg" type="image/x-icon">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-left">
                <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"><img class="logo main-logo" src="/js.png" alt="Logo" height="50" width="50"></a>
                <h1> | SV3D</h1>
            </div>
            <div class="icons">
                <a href="https://threejs.org/"><img class="logo" src="/icon.svg" alt="icon"></a>
                <a href="https://vite.dev/"><img class="logo" src="/vite.svg" alt="vite"></a>
            </div>
        </div>
    </header>
    <main>
        <section class="left-panel">
            <h2>SVG Preview</h2>
            <div id="svg-preview"></div>
            <div class="toolbar">
                <label for="svg-file" class="custom-file-label">Pilih File</label>
                <input type="file" id="svg-file" accept=".svg" style="display:none;">
                <button id="export-btn">Export STL</button>
                <span id="info"></span>
                <label for="thickness" class="thickness-label">Tebal</label>
                <input type="range" id="thickness" min="1" max="30" value="5" step="1" style="vertical-align:middle;">
                <span id="thickness-value">5</span>
            </div>
        </section>
        <section class="right-panel">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <small>&copy; 2025 SVG to 3D STL Converter</small>
        </div>
    </footer>
    <script type="module" src="src/main.js"></script>
</body>
</html>
