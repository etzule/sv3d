<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SVG to 3D STL Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>SVG to 3D STL Converter</h1>
            <div class="toolbar">
                <label for="svg-file" class="custom-file-label">Pilih File</label>
                <input type="file" id="svg-file" accept=".svg" style="display:none;">
                <button id="export-btn">Export STL</button>
                <span id="info"></span>
            </div>
        </div>
    </header>
    <main>
        <section class="left-panel">
            <h2>SVG Preview</h2>
            <div id="svg-preview"></div>
        </section>
        <section class="right-panel">
            <div class="canvas-wrapper">
                <canvas id="canvas"></canvas>
            </div>
        </section>
    </main>
    <footer>
        <div class="container">
            <small>&copy; 2025 SVG to 3D STL Converter</small>
        </div>
    </footer>
    <script type="module" src="src/main.js"></script>
</body>
</html>

<style>
   :root {
    --primary: #1976d2;
    --background: #f5f7fa;
    --panel-bg: #fff;
    --shadow: 0 2px 8px #0001;
    --radius: 12px;
}

html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--background);
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    background: var(--primary);
    color: #fff;
    padding: 0.5rem 0;
    box-shadow: var(--shadow);
}

header .container {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem;
}

header h1 {
    margin: 0 0 0.5rem 0;
    font-size: 1.5rem;
    font-weight: 600;
}

.toolbar {
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
}

.custom-file-label {
    background: #fff;
    color: var(--primary);
    border: none;
    border-radius: var(--radius);
    padding: 0.5rem 1.2rem;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background 0.2s;
    display: inline-block;
    margin-right: 0.5rem;
}
.custom-file-label:hover {
    background: #e3eafc;
}

.toolbar button {
    background: #fff;
    color: var(--primary);
    border: none;
    border-radius: var(--radius);
    padding: 0.5rem 1.2rem;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background 0.2s;
}
.toolbar button:hover {
    background: #e3eafc;
}

main {
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    gap: 1.5rem;
    max-width: 1200px;
    margin: 2rem auto 0 auto;
    padding: 0 1rem;
    min-height: 0;
}

.left-panel {
    flex: 0 0 260px;
    background: var(--panel-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 1rem;
    min-width: 200px;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.left-panel h2 {
    margin-top: 0;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--primary);
}

#svg-preview {
    width: 100%;
    min-height: 180px;
    max-width: 260px;
    max-height: 320px;
    background: #f8fafc;
    border: 1px solid #e0e0e0;
    border-radius: var(--radius);
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
}

.right-panel {
    flex: 1 1 0;
    background: var(--panel-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    align-items: stretch;
    justify-content: stretch;
    min-width: 0;
    min-height: 400px;
    position: relative;
}

.canvas-wrapper {
    width: 100%;
    height: 100%;
    min-height: 400px;
    display: flex;
    align-items: stretch;
    justify-content: stretch;
}

#canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
    border-radius: var(--radius);
    background: #fff;
}

footer {
    background: #222;
    color: #fff;
    text-align: center;
    padding: 1rem 0 0.5rem 0;
    margin-top: auto;
}

footer .container {
    max-width: 1200px;
    margin: 0 auto;
    font-size: 0.95rem;
}

@media (max-width: 900px) {
    main {
        flex-direction: column;
        gap: 1rem;
    }
    .left-panel, .right-panel {
        max-width: 100%;
        min-width: 0;
    }
    .left-panel {
        margin-bottom: 1rem;
    }
}
</style>
